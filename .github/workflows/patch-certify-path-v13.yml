name: Patch v1.3 certification checksum path once

on:
  push:
    branches: [agent/v1.3-platform]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/v1.3-platform
          fetch-depth: 0
          persist-credentials: true
      - name: Correct checksum working directory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingaibot-ci"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin agent/v1.3-platform
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/certify-v13-once.yml')
          if p.exists():
              text = p.read_text()
              text = text.replace('sha256sum -c dist-v13/SHA256SUMS', '(cd dist-v13 && sha256sum -c SHA256SUMS)')
              p.write_text(text)
          PY
          rm -f .github/workflows/patch-certify-path-v13.yml
          git add -A
          git commit -m "Fix v1.3 certification checksum path" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:agent/v1.3-platform; then exit 0; fi
            git fetch origin agent/v1.3-platform
            git rebase origin/agent/v1.3-platform
          done
          exit 1
