name: Publish verified KINGAIBOT source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'kingaiwork/KINGAIBOT'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true

      - name: Set up Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false

      - name: Reconstruct source with full-archive integrity enforcement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, sys

          target = '5d61f61acbe3752399d14fbb07bd0a0d21c1c4cce5374ee6e7133c38b5a32493'
          root = Path('.bootstrap')
          parts = [root / f'source.part.{i:02d}' for i in range(7)]
          raw = [p.read_bytes() for p in parts]

          def decode_and_check(chunks):
              try:
                  archive = base64.b64decode(b''.join(chunks), validate=True)
              except Exception:
                  return None
              if hashlib.sha256(archive).hexdigest() == target:
                  return archive
              return None

          archive = decode_and_check(raw)
          if archive is None:
              # One transport block was observed to contain exactly one extra byte.
              # Repair is accepted ONLY if deleting one byte yields the precommitted
              # SHA-256 of the complete original source archive.
              idx = 5
              bad = raw[idx]
              if len(bad) != 18001:
                  raise SystemExit(f'unexpected transport shape: part05={len(bad)} bytes')
              for pos in range(len(bad)):
                  candidate = bad[:pos] + bad[pos+1:]
                  trial = list(raw)
                  trial[idx] = candidate
                  archive = decode_and_check(trial)
                  if archive is not None:
                      print(f'transport repaired at part05 byte offset {pos}; full SHA-256 verified')
                      break
              else:
                  raise SystemExit('no one-byte transport repair matched the committed source SHA-256')

          Path('/tmp/source.tar.gz').write_bytes(archive)
          PY

          echo "5d61f61acbe3752399d14fbb07bd0a0d21c1c4cce5374ee6e7133c38b5a32493  /tmp/source.tar.gz" | sha256sum -c -

      - name: Reject unsafe archive paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile
          with tarfile.open('/tmp/source.tar.gz', 'r:gz') as tf:
              for member in tf.getmembers():
                  name = member.name
                  normalized = name.lstrip('./')
                  if name.startswith('/') or '..' in normalized.split('/'):
                      raise SystemExit(f'unsafe tar member: {name}')
                  if member.issym() or member.islnk():
                      link = member.linkname
                      if link.startswith('/') or '..' in link.split('/'):
                          raise SystemExit(f'unsafe tar link: {name} -> {link}')
          PY

      - name: Replace transport tree with real source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/source.tar.gz -C .

      - name: Verify source manifest and Go source formatting
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SOURCE-MANIFEST-SHA256.txt
          test -z "$(gofmt -l .)"

      - name: Test with Go 1.26.5
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Publish real source tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish KINGAIBOT v1.1.0 hardened source"
          git push origin HEAD:main
