name: Final certify v1.3 stable head once

on:
  push:
    branches: [agent/v1.3-platform]

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require stable branch without temporary mutation workflows
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(find .github/workflows -maxdepth 1 -type f \( \
            -name 'patch-*.yml' -o \
            -name 'fix-*.yml' -o \
            -name 'format-v13.yml' -o \
            -name 'finalize-v13.yml' -o \
            -name 'final-gofmt-v13.yml' -o \
            -name 'certify-v13-once.yml' \
          \) -print)"
          if [[ -n "$forbidden" ]]; then
            echo "Temporary mutation workflows still exist; refusing to certify:" >&2
            echo "$forbidden" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache: true
      - name: Source, unit, race and vulnerability gates
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Build all four programs
        run: |
          go build ./cmd/kingagentd
          go build ./cmd/kingagent
          go build ./cmd/kingworker
          go build ./cmd/kingconsole
      - name: Build and verify full release set
        env:
          VERSION: 1.3.0-final-cert
          KINGAGENT_MIN_RELEASE_GO: 1.26.6
          SOURCE_DATE_EPOCH: 315532800
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-release-v13.sh
          ./scripts/build-release-v13.sh
          (cd dist-v13 && sha256sum -c SHA256SUMS)
          test -s dist-v13/RELEASE-MANIFEST.json
          test -s dist-v13/sbom.cdx.json
          test "$(find dist-v13 -maxdepth 1 -name 'kingaibot_*.tar.gz' | wc -l)" -eq 4
          test "$(find dist-v13 -maxdepth 1 -name 'kingaibot_*.zip' | wc -l)" -eq 2
      - name: Build server, worker and console images
        run: |
          docker build -f deploy/docker/Dockerfile -t kingaibot-server:final-cert .
          docker build -f deploy/docker/Dockerfile.worker -t kingaibot-worker:final-cert .
          docker build -f deploy/docker/Dockerfile.console -t kingaibot-console:final-cert .

  certify:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/v1.3-platform
          fetch-depth: 0
          persist-credentials: true
      - name: Record exact stable validated source and self-remove
        env:
          VALIDATED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingaibot-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin agent/v1.3-platform
          current="$(git rev-parse origin/agent/v1.3-platform)"
          if [[ "$current" != "$VALIDATED_SHA" ]]; then
            echo "Branch moved during validation; refusing stale certification." >&2
            echo "validated=$VALIDATED_SHA current=$current" >&2
            exit 1
          fi
          cat > docs/VALIDATION-STATUS-V1.3.md <<EOF
          # KINGAIBOT V1.3 Final Validation Status

          Validated source commit: \`$VALIDATED_SHA\`

          The record above is emitted only when the exact stable source revision has passed:

          - no temporary branch-mutating patch/formatter workflows remaining
          - clean gofmt
          - go vet
          - go test -race ./...
          - govulncheck ./...
          - kingagentd build
          - kingagent build
          - kingworker build
          - kingconsole build
          - six-target Linux/macOS/Windows full release bundle
          - SHA256SUMS verification
          - CycloneDX SBOM generation
          - server Docker image build
          - worker Docker image build
          - console Docker image build

          GitHub CodeQL remains an independent release gate and should be green before merge/tag.
          EOF
          rm -f .github/workflows/certify-v13-final-once.yml
          git add -A
          git commit -m "Record final v1.3 validated source"
          git push origin HEAD:agent/v1.3-platform
