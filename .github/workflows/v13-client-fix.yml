name: V1.3 client integration fix

on:
  push:
    branches: [agent/v1.3-cross-platform-clients]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.repository == 'kingaiwork/KINGAIBOT'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev librsvg2-bin patchelf
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Fix current plugin integration and generate icons
        working-directory: clients/control-center
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          rsvg-convert -w 1024 -h 1024 src-tauri/icons/kingaibot-source.svg > /tmp/kingaibot-icon.png
          file /tmp/kingaibot-icon.png
          npx tauri icon /tmp/kingaibot-icon.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/lib.rs')
          s = p.read_text()
          old = '''app.handle()
                .plugin(tauri_plugin_biometric::Builder::new().build())?;'''
          new = '''app.handle().plugin(tauri_plugin_biometric::init())?;'''
          if old not in s:
              raise SystemExit('biometric integration patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Validate corrected client core
        working-directory: clients/control-center
        run: |
          set -euo pipefail
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Commit verified integration fixes
        run: |
          set -euo pipefail
          rm .github/workflows/v13-client-fix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Tauri mobile integration and generate cross-platform icons'
          git push origin HEAD:agent/v1.3-cross-platform-clients
