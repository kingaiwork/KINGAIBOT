name: V1.3 Container Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build server image
        run: docker build -f deploy/docker/Dockerfile -t kingaibot-server:test .
      - name: Build worker image
        run: docker build -f deploy/docker/Dockerfile.worker -t kingaibot-worker:test .
      - name: Build console image
        run: docker build -f deploy/docker/Dockerfile.console -t kingaibot-console:test .
