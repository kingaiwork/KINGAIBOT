name: Bootstrap hardened source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'kingaiwork/KINGAIBOT'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true

      - name: Set up Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false

      - name: Reconstruct, verify, test, and publish source
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/source.part.* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          echo "5d61f61acbe3752399d14fbb07bd0a0d21c1c4cce5374ee6e7133c38b5a32493  /tmp/source.tar.gz" | sha256sum -c -

          python3 - <<'PY'
          import tarfile
          with tarfile.open('/tmp/source.tar.gz', 'r:gz') as tf:
              for member in tf.getmembers():
                  name = member.name
                  normalized = name.lstrip('./')
                  if name.startswith('/') or '..' in normalized.split('/'):
                      raise SystemExit(f'unsafe tar member: {name}')
          PY

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/source.tar.gz -C .

          sha256sum -c SOURCE-MANIFEST-SHA256.txt
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish KINGAIBOT v1.1.0 hardened source"
          git push origin HEAD:main
