name: Certify v1.3 release candidate once

on:
  push:
    branches: [agent/v1.3-platform]

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache: true
      - name: Source and security tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Build all programs
        run: |
          go build ./cmd/kingagentd
          go build ./cmd/kingagent
          go build ./cmd/kingworker
          go build ./cmd/kingconsole
      - name: Build deterministic full release set
        env:
          VERSION: 1.3.0-cert
          KINGAGENT_MIN_RELEASE_GO: 1.26.6
          SOURCE_DATE_EPOCH: 315532800
        run: |
          chmod +x scripts/build-release-v13.sh
          ./scripts/build-release-v13.sh
          sha256sum -c dist-v13/SHA256SUMS
          test -s dist-v13/RELEASE-MANIFEST.json
          test -s dist-v13/sbom.cdx.json
      - name: Build role-separated containers
        run: |
          docker build -f deploy/docker/Dockerfile -t kingaibot-server:cert .
          docker build -f deploy/docker/Dockerfile.worker -t kingaibot-worker:cert .
          docker build -f deploy/docker/Dockerfile.console -t kingaibot-console:cert .

  certify:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/v1.3-platform
          fetch-depth: 0
          persist-credentials: true
      - name: Record exact validated revision and self-remove
        env:
          VALIDATED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingaibot-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin agent/v1.3-platform
          current="$(git rev-parse origin/agent/v1.3-platform)"
          if [[ "$current" != "$VALIDATED_SHA" ]]; then
            echo "Branch moved from validated SHA $VALIDATED_SHA to $current; a newer run must certify it." >&2
            exit 1
          fi
          cat > docs/VALIDATION-STATUS-V1.3.md <<EOF
          # KINGAIBOT V1.3 Validation Status

          Validated source commit: \`$VALIDATED_SHA\`

          This record was written only after the read-only validation job completed successfully on the exact commit above.

          Gates completed:

          - gofmt clean tree
          - go vet
          - go test -race ./...
          - govulncheck ./...
          - kingagentd build
          - kingagent build
          - kingworker build
          - kingconsole build
          - deterministic six-target full release bundle
          - SHA256SUMS verification
          - CycloneDX SBOM generation
          - server Docker image build
          - worker Docker image build
          - console Docker image build

          CodeQL remains an independent GitHub workflow and must also be green on the release candidate before merge/tag.
          EOF
          rm -f .github/workflows/certify-v13-once.yml
          rm -f .github/workflows/format-v13.yml .github/workflows/finalize-v13.yml
          rm -f .github/workflows/patch-v13-last.yml .github/workflows/patch-runtime-api-v13.yml
          git add -A
          git commit -m "Certify v1.3 release candidate"
          git push origin HEAD:agent/v1.3-platform
