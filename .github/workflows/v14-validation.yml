name: V1.4 Full Validation Zero-Bill

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-linux-and-cross-compile:
    runs-on: [self-hosted, linux, x64, kingai-vps]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Format, vet, tests and vulnerability scan
        shell: bash
        run: |
          set -euo pipefail
          go version
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          if ! command -v govulncheck >/dev/null 2>&1; then go install golang.org/x/vuln/cmd/govulncheck@v1.6.0; fi
          govulncheck ./...
      - name: Build all local binaries
        run: |
          go build ./cmd/kingagentd
          go build ./cmd/kingagent
          go build ./cmd/kingworker
          go build ./cmd/kingconsole
      - name: Cross-compile Windows and macOS without hosted runners
        shell: bash
        run: |
          set -euo pipefail
          out="/srv/kingai/qa/KINGAIBOT/${GITHUB_SHA}/cross"
          mkdir -p "$out"
          for cmd in kingagentd kingagent kingworker kingconsole; do
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$out/${cmd}-windows-amd64.exe" "./cmd/${cmd}"
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o "$out/${cmd}-darwin-amd64" "./cmd/${cmd}"
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o "$out/${cmd}-darwin-arm64" "./cmd/${cmd}"
          done
          sha256sum "$out"/* > "$out/SHA256SUMS"
          echo 'Native macOS/Windows runtime execution is intentionally not delegated to paid cloud runners; only cross-compilation is automatic.'
      - name: Build six-target release set
        env:
          VERSION: 1.4.0-ci
          KINGAGENT_MIN_RELEASE_GO: 1.26.6
          SOURCE_DATE_EPOCH: 315532800
        run: |
          chmod +x scripts/build-release-v14.sh
          ./scripts/build-release-v14.sh
          test -f dist-v14/SHA256SUMS
          test -f dist-v14/RELEASE-MANIFEST.json
          test "$(find dist-v14 -maxdepth 1 -name 'kingaibot_*.tar.gz' | wc -l)" -eq 4
          test "$(find dist-v14 -maxdepth 1 -name 'kingaibot_*.zip' | wc -l)" -eq 2
          out="/srv/kingai/qa/KINGAIBOT/${GITHUB_SHA}/release"
          mkdir -p "$out"
          cp -a dist-v14/. "$out/"
