name: V1.4 Full Validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit and race tests
        run: go test -race -count=1 ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Build all local binaries
        run: |
          go build ./cmd/kingagentd
          go build ./cmd/kingagent
          go build ./cmd/kingworker
          go build ./cmd/kingconsole
      - name: Build six-target release set
        env:
          VERSION: 1.4.0-ci
          KINGAGENT_MIN_RELEASE_GO: 1.26.6
          SOURCE_DATE_EPOCH: 315532800
        run: |
          chmod +x scripts/build-release-v14.sh
          ./scripts/build-release-v14.sh
          test -f dist-v14/SHA256SUMS
          test -f dist-v14/RELEASE-MANIFEST.json
          test "$(find dist-v14 -maxdepth 1 -name 'kingaibot_*.tar.gz' | wc -l)" -eq 4
          test "$(find dist-v14 -maxdepth 1 -name 'kingaibot_*.zip' | wc -l)" -eq 2

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache: true
      - run: go test -count=1 ./...
      - run: |
          go build ./cmd/kingagentd
          go build ./cmd/kingagent
          go build ./cmd/kingworker
          go build ./cmd/kingconsole

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache: true
      - shell: pwsh
        run: |
          go test -count=1 ./...
          go build ./cmd/kingagentd
          go build ./cmd/kingagent
          go build ./cmd/kingworker
          go build ./cmd/kingconsole
