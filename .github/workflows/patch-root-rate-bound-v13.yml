name: Bound root limiter memory once

on:
  push:
    branches: [agent/v1.3-platform]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/v1.3-platform
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingaibot-ci"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin agent/v1.3-platform
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/platform/http_guard.go')
          text = p.read_text()
          old = '''\t// Opportunistic bounded cleanup avoids an attacker growing the map forever.
\tif len(l.entries) > 4096 {
\t\tcutoff := now.Add(-2 * rootRateWindow)
\t\tfor k, v := range l.entries {
\t\t\tif v.WindowStart.Before(cutoff) {
\t\t\t\tdelete(l.entries, k)
\t\t\t}
\t\t}
\t}
'''
          new = '''\t// Opportunistic cleanup plus a hard ceiling keeps the limiter itself from
\t// becoming an attacker-controlled memory sink. If all entries are fresh,
\t// discard arbitrary non-current histories until the map is back under the
\t// low-water mark; this may reduce throttling precision but never grants
\t// execution authority.
\tif len(l.entries) > 4096 {
\t\tcutoff := now.Add(-2 * rootRateWindow)
\t\tfor k, v := range l.entries {
\t\t\tif v.WindowStart.Before(cutoff) {
\t\t\t\tdelete(l.entries, k)
\t\t\t}
\t\t}
\t}
\tif len(l.entries) > 8192 {
\t\tfor k := range l.entries {
\t\t\tif k == key {
\t\t\t\tcontinue
\t\t\t}
\t\t\tdelete(l.entries, k)
\t\t\tif len(l.entries) <= 4096 {
\t\t\t\tbreak
\t\t\t}
\t\t}
\t}
'''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('limiter cleanup block did not match expected source')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/platform/http_guard.go
          go test ./internal/platform
          rm -f .github/workflows/patch-root-rate-bound-v13.yml
          git add -A
          git commit -m "Bound root HTTP rate limiter memory" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:agent/v1.3-platform; then exit 0; fi
            git fetch origin agent/v1.3-platform
            git rebase origin/agent/v1.3-platform
          done
          exit 1
