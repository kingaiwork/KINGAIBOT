name: V1.3 device identity migration

on:
  push:
    branches: [agent/v1.3-device-auth]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.repository == 'kingaiwork/KINGAIBOT'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: Apply device identity migration
        run: |
          set -euo pipefail
          python3 scripts/v13-device-auth-migrate.py
          gofmt -w internal/api/server.go internal/api/device_auth_test.go internal/device/store.go internal/device/store_test.go cmd/kingagentd/main.go
      - name: Validate device identity and entire Go runtime
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go test -count=1 ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: Commit validated server identity layer
        run: |
          set -euo pipefail
          rm -f .github/workflows/v13-device-auth.yml .github/workflows/v13-client-fix.yml scripts/v13-device-auth-migrate.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add one-time pairing and scoped revocable device credentials'
          git push origin HEAD:agent/v1.3-device-auth
