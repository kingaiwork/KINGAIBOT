name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Create and publish this vMAJOR.MINOR.PATCH tag from main; leave empty when dispatching on an existing tag'
        required: false
        type: string
        default: ''

jobs:
  prepare-tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Validate and create immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.publish_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]] || {
            echo "publish_tag must be vMAJOR.MINOR.PATCH (optional suffix allowed)" >&2
            exit 2
          }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Ref refs/tags/${TAG} already exists; refusing to move or overwrite a release tag." >&2
            exit 3
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${GITHUB_SHA}" >/dev/null
          echo "Created immutable tag ${TAG} at ${GITHUB_SHA}."
          gh workflow run release.yml --ref "$TAG"
          echo "Dispatched signed release workflow at refs/tags/${TAG}."

  release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]] || {
            echo "Release must run from a version tag." >&2
            exit 2
          }
      - name: Security and correctness gate
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
          go test -race -count=1 ./...
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-release.sh
      - name: Attest public release provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/kingaibot_*.tar.gz
            dist/kingaibot_*.zip
            dist/sbom.cdx.json
            dist/SHA256SUMS
      - name: Attest public SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/kingaibot_*.tar.gz
            dist/kingaibot_*.zip
          sbom-path: dist/sbom.cdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release assets with GitHub OIDC
        run: |
          set -euo pipefail
          for f in dist/kingaibot_* dist/sbom.cdx.json dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "KINGAIBOT ${GITHUB_REF_NAME}"
