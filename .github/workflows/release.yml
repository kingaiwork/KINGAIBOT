name: Release Zero-Bill

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'vMAJOR.MINOR.PATCH tag to build locally on the owned VPS'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: [self-hosted, linux, x64, kingai-vps]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release input and toolchain
        id: version
        env:
          INPUT_TAG: ${{ inputs.publish_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]] || { echo 'Invalid release tag' >&2; exit 2; }
          expected="v$(tr -d '[:space:]' < VERSION)"
          [[ "$tag" == "$expected" ]] || { echo "Tag $tag does not match VERSION ($expected)" >&2; exit 2; }
          go version
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Security and correctness gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          if ! command -v govulncheck >/dev/null 2>&1; then go install golang.org/x/vuln/cmd/govulncheck@v1.6.0; fi
          govulncheck ./...
          go test -race -count=1 ./...

      - name: Build release locally on owned VPS
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          KINGAGENT_MIN_RELEASE_GO: 1.26.6
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-release-v14.sh
          ./scripts/build-release-v14.sh
          out="/srv/kingai/releases/KINGAIBOT/${VERSION}"
          rm -rf "$out.tmp"
          mkdir -p "$out.tmp"
          cp -a dist-v14/. "$out.tmp/"
          rm -rf "$out"
          mv "$out.tmp" "$out"
          echo "Release retained on owned VPS: $out"

      - name: Publication boundary
        run: |
          echo 'No GitHub Release upload, artifact upload, OIDC attestation storage, or automatic tag creation is performed.'
          echo 'Any future public distribution step must be separately verified as non-billable and explicitly approved.'
