name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Security and correctness gate
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
          go test -race -count=1 ./...
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-release.sh
      - name: Attest public release provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/king-agent-os_*.tar.gz
            dist/king-agent-os_*.zip
            dist/sbom.cdx.json
            dist/SHA256SUMS
      - name: Attest public SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/king-agent-os_*.tar.gz
            dist/king-agent-os_*.zip
          sbom-path: dist/sbom.cdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release assets with GitHub OIDC
        run: |
          set -euo pipefail
          for f in dist/king-agent-os_* dist/sbom.cdx.json dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "KINGAIBOT ${GITHUB_REF_NAME}"
