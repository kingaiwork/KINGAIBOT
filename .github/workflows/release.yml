name: Release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional vMAJOR.MINOR.PATCH tag to publish from main; empty uses VERSION'
        required: false
        type: string
        default: ''

jobs:
  prepare-tag:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.publish_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"
          else
            test -f VERSION || { echo "VERSION file is required for automatic releases" >&2; exit 2; }
            VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
            TAG="v${VERSION_VALUE}"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]] || {
            echo "release tag must be vMAJOR.MINOR.PATCH (optional suffix allowed)" >&2
            exit 2
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create immutable tag and dispatch tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; no automatic release is needed."
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${GITHUB_SHA}" >/dev/null
          echo "Created immutable tag ${TAG} at ${GITHUB_SHA}."
          # Tag events created with GITHUB_TOKEN do not recursively start normal
          # workflows, so explicitly dispatch this workflow on the immutable tag.
          gh workflow run release.yml --ref "$TAG"
          echo "Dispatched signed release workflow for ${TAG}."

  release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache: true
      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]] || {
            echo "Release must run from a version tag." >&2
            exit 2
          }
          test -f VERSION
          expected="v$(tr -d '[:space:]' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)." >&2
            exit 2
          }
      - name: Security and correctness gate
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
          go test -race -count=1 ./...
      - name: Build six-target runtime + visual client release
        env:
          VERSION: ${{ github.ref_name }}
          KINGAGENT_MIN_RELEASE_GO: 1.26.6
        run: |
          chmod +x scripts/build-release-v14.sh
          ./scripts/build-release-v14.sh
      - name: Attest public release provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: |
            dist-v14/kingaibot_*.tar.gz
            dist-v14/kingaibot_*.zip
            dist-v14/sbom.cdx.json
            dist-v14/SHA256SUMS
            dist-v14/RELEASE-MANIFEST.json
      - name: Attest public SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: |
            dist-v14/kingaibot_*.tar.gz
            dist-v14/kingaibot_*.zip
          sbom-path: dist-v14/sbom.cdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign release assets with GitHub OIDC
        run: |
          set -euo pipefail
          for f in dist-v14/kingaibot_* dist-v14/sbom.cdx.json dist-v14/SHA256SUMS dist-v14/RELEASE-MANIFEST.json; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes --title "KINGAIBOT $tag"
          fi
          gh release upload "$tag" dist-v14/* --clobber
