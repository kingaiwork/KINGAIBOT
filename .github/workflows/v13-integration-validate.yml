name: V1.3 integration validation

on:
  push:
    branches: [agent/v1.3-integration]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.repository == 'kingaiwork/KINGAIBOT'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/control-center/package-lock.json
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Integrate pairing UI
        run: |
          set -euo pipefail
          python3 scripts/v13-client-ui-integrate.py
          cargo fmt --manifest-path clients/control-center/src-tauri/Cargo.toml --all
      - name: Validate server Runtime
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go test -count=1 ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: Validate Control Center
        working-directory: clients/control-center
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Commit validated V1.3 integration
        run: |
          set -euo pipefail
          rm .github/workflows/v13-integration-validate.yml scripts/v13-client-ui-integrate.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate one-time device pairing into cross-platform Control Center'
          git push origin HEAD:agent/v1.3-integration
