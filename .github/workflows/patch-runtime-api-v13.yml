name: Patch runtime API classification once

on:
  push:
    branches: [agent/v1.3-platform]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    concurrency:
      group: kingaibot-v13-runtime-api-patch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/v1.3-platform
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Apply task API error mapping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingaibot-ci"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin agent/v1.3-platform
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/api/server.go')
          text = p.read_text()
          old = '''\tt, err := s.rt.Create(strings.TrimSpace(in.Input), in.Metadata)
\tif err != nil {
\t\tproblem(w, 400, "invalid_task", err.Error())
\t\treturn
\t}
\twriteJSON(w, 202, t)
'''
          new = '''\tt, err := s.rt.Create(strings.TrimSpace(in.Input), in.Metadata)
\tif err != nil {
\t\tswitch {
\t\tcase errors.Is(err, karuntime.ErrInvalidTaskInput):
\t\t\tproblem(w, http.StatusBadRequest, "invalid_task", err.Error())
\t\tcase errors.Is(err, karuntime.ErrQueueUnavailable):
\t\t\tproblem(w, http.StatusServiceUnavailable, "runtime_busy", "runtime queue is temporarily unavailable")
\t\tdefault:
\t\t\tproblem(w, http.StatusInternalServerError, "task_create_failed", "task could not be durably scheduled")
\t\t}
\t\treturn
\t}
\twriteJSON(w, http.StatusAccepted, t)
'''
          if old not in text:
              raise SystemExit('createTask block did not match expected source')
          text = text.replace(old, new, 1)

          old = '''\tif err := s.rt.DecideApproval(r.PathValue("id"), strings.ToLower(strings.TrimSpace(in.Status))); err != nil {
\t\tproblem(w, 400, "approval_failed", err.Error())
\t\treturn
\t}
'''
          new = '''\tif err := s.rt.DecideApproval(r.PathValue("id"), strings.ToLower(strings.TrimSpace(in.Status))); err != nil {
\t\tif errors.Is(err, karuntime.ErrQueueUnavailable) {
\t\t\tproblem(w, http.StatusServiceUnavailable, "runtime_busy", "approval persisted but runtime queue is temporarily unavailable")
\t\t} else {
\t\t\tproblem(w, http.StatusBadRequest, "approval_failed", err.Error())
\t\t}
\t\treturn
\t}
'''
          if old not in text:
              raise SystemExit('decideApproval block did not match expected source')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/runtime/runtime.go internal/api/server.go
          rm -f .github/workflows/patch-runtime-api-v13.yml
          git add -A
          git commit -m "Classify runtime API failures correctly" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:agent/v1.3-platform; then exit 0; fi
            git fetch origin agent/v1.3-platform
            git rebase origin/agent/v1.3-platform
          done
          exit 1
