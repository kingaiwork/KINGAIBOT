name: Finalize v1.3 branch once

on:
  push:
    branches: [agent/v1.3-platform]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    concurrency:
      group: kingaibot-v13-finalizer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/v1.3-platform
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Format, pin and remove temporary formatters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingaibot-ci"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin agent/v1.3-platform

          find cmd internal -type f -name '*.go' -print0 | xargs -0 gofmt -w

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release-v13-full.yml')
          text = p.read_text()
          text = text.replace(
              'uses: actions/upload-artifact@v4',
              'uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2',
          )
          p.write_text(text)
          PY

          chmod +x scripts/build-release-v13.sh
          rm -f .github/workflows/format-v13.yml
          rm -f .github/workflows/finalize-v13.yml

          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes required"
            exit 0
          fi
          git commit -m "Finalize v1.3 platform source"

          for attempt in 1 2 3; do
            if git push origin HEAD:agent/v1.3-platform; then
              exit 0
            fi
            echo "Push raced with another branch update; rebasing attempt ${attempt}" >&2
            git fetch origin agent/v1.3-platform
            git rebase origin/agent/v1.3-platform
          done
          echo "Unable to publish finalization after retries" >&2
          exit 1
