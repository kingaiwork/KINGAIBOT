name: Fix stale runtime import once

on:
  push:
    branches: [agent/v1.3-platform]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/v1.3-platform
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingaibot-ci"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin agent/v1.3-platform
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/runtime/runtime.go')
          text = p.read_text().replace('\t"os"\n', '')
          p.write_text(text)
          PY
          gofmt -w internal/runtime/runtime.go internal/runtime/*_test.go
          go test ./internal/runtime ./internal/api
          rm -f .github/workflows/fix-runtime-import-v13.yml
          git add -A
          git commit -m "Remove stale runtime import" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:agent/v1.3-platform; then exit 0; fi
            git fetch origin agent/v1.3-platform
            git rebase origin/agent/v1.3-platform
          done
          exit 1
