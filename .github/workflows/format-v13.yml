name: Format v1.3 branch
on:
  push:
    branches: [agent/v1.3-platform]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/v1.3-platform
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
      - name: Format v1.3 Go sources
        run: |
          gofmt -w \
            cmd/kingagentd/main.go \
            internal/agent/agent.go \
            internal/platform/platform.go \
            internal/platform/http.go \
            internal/platform/platform_test.go \
            internal/tool/extensions.go \
            internal/tool/extensions_test.go
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "kingaibot-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git add internal/platform internal/tool/extensions.go internal/tool/extensions_test.go
          git commit -m "Format v1.3 platform sources"
          git push origin HEAD:agent/v1.3-platform
