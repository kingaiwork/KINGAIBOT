name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  security-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Third-party provenance inventory
        run: ./scripts/check-third-party-inventory.sh
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Release guard requires production Go
        run: KINGAGENT_MIN_RELEASE_GO=1.26.6 VERSION=ci SOURCE_DATE_EPOCH=315532800 ./scripts/build-release.sh

  macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Native test and build
        run: |
          go test -count=1 ./...
          go build ./cmd/kingagentd
          go build ./cmd/kingagent
          for f in scripts/*.sh; do bash -n "$f"; done

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Native test and build
        shell: pwsh
        run: |
          go test -count=1 ./...
          go build ./cmd/kingagentd
          go build ./cmd/kingagent
      - name: Parse PowerShell installer and updater
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('scripts/install.ps1','scripts/update.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build hardened container
        run: docker build --pull -f deploy/docker/Dockerfile .
