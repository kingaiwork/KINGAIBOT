name: CI Zero-Bill
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-test-build:
    runs-on: [self-hosted, linux, x64, kingai-vps]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require owned VPS toolchain
        shell: bash
        run: |
          set -euo pipefail
          go version
          node --version || true
          docker --version
          version="$(go version | awk '{print $3}' | sed 's/^go//')"
          [[ "$version" == 1.26.* ]] || { echo "Go 1.26.x is required on the VPS runner; got $version" >&2; exit 1; }

      - name: Zero-bill dependency guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude='ci.yml' -E 'runs-on:[[:space:]]*(ubuntu|windows|macos)|actions/upload-artifact|github/codeql-action|OPENAI_API_KEY|ANTHROPIC_API_KEY|DEEPSEEK_API_KEY|GEMINI_API_KEY' .github .kingai 2>/dev/null; then
            echo 'ZERO-BILL policy violation found.' >&2
            exit 1
          fi

      - name: Format, vet, provenance and vulnerability checks
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          bash scripts/check-third-party-inventory.sh
          if ! command -v govulncheck >/dev/null 2>&1; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          fi
          govulncheck ./...
          go test -race -count=1 ./...
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Build Linux and cross-compile Windows/macOS on VPS
        shell: bash
        run: |
          set -euo pipefail
          out="/srv/kingai/builds/KINGAIBOT/${GITHUB_SHA}"
          mkdir -p "$out"
          KINGAGENT_MIN_RELEASE_GO=1.26.6 VERSION=ci SOURCE_DATE_EPOCH=315532800 ./scripts/build-release.sh
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$out/kingagent-linux-amd64" ./cmd/kingagent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$out/kingagent-windows-amd64.exe" ./cmd/kingagent
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o "$out/kingagent-darwin-amd64" ./cmd/kingagent
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o "$out/kingagent-darwin-arm64" ./cmd/kingagent
          sha256sum "$out"/* > "$out/SHA256SUMS"
          echo "Build evidence retained on owned VPS: $out"

      - name: Build hardened container locally
        run: docker build --pull -f deploy/docker/Dockerfile .
