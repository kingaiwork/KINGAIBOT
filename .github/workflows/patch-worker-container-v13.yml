name: Fix worker container data ownership once

on:
  push:
    branches: [agent/v1.3-platform]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/v1.3-platform
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingaibot-ci"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin agent/v1.3-platform
          cat > deploy/docker/Dockerfile.worker <<'EOF'
          FROM golang:1.26.6-trixie AS build
          WORKDIR /src
          COPY . .
          RUN CGO_ENABLED=0 go test ./cmd/kingworker ./internal/cluster ./internal/storage ./internal/netguard && \
              CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w -X main.version=1.3.0' -o /out/kingworker ./cmd/kingworker && \
              mkdir -p /out/data && chmod 0700 /out/data

          FROM gcr.io/distroless/static-debian13:nonroot
          COPY --from=build /out/kingworker /usr/local/bin/kingworker
          COPY --from=build --chown=65532:65532 /out/data /data
          VOLUME ["/data"]
          ENTRYPOINT ["/usr/local/bin/kingworker"]
          CMD ["-workspace","/data"]
          EOF
          rm -f .github/workflows/patch-worker-container-v13.yml
          git add -A
          git commit -m "Fix worker container data ownership" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:agent/v1.3-platform; then exit 0; fi
            git fetch origin agent/v1.3-platform
            git rebase origin/agent/v1.3-platform
          done
          exit 1
