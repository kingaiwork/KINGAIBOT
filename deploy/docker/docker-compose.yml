services:
  kingagent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:18888:18888"
    environment:
      KINGAGENT_ADMIN_TOKEN: "${KINGAGENT_ADMIN_TOKEN:?required}"
      KINGAGENT_MCP_TOKEN: "${KINGAGENT_MCP_TOKEN:?required}"
      KINGAGENT_A2A_TOKEN: "${KINGAGENT_A2A_TOKEN:?required}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      COMPATIBLE_MODEL_API_KEY: "${COMPATIBLE_MODEL_API_KEY:-}"
    volumes:
      - kingagent-data:/data
      - ${KINGAGENT_CONFIG_FILE:-./config.docker.json}:/etc/kingagent/config.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kingagent-data:
