[package]
name = "kingaibot-control-center"
version = "0.1.0"
description = "Secure cross-platform control center for KINGAIBOT"
authors = ["KING AI <vip@kingai.work>"]
license = "LicenseRef-KINGAIBOT-Commercial"
repository = "https://github.com/kingaiwork/KINGAIBOT"
edition = "2021"

[lib]
name = "kingaibot_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-stronghold = "2"
url = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"
